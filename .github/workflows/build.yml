name: Validate and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-tests -DDYNAMIC_TESTS_ONLY=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-tests --config Release
      - run: ctest --test-dir build-tests -C Release --output-on-failure
  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@61a56c697aea9655e3f31c6c1b83870431f30434
        id: build
        with:
          sdk: given
          target: Win64
          build-config: Release
      - uses: actions/upload-artifact@v4
        with:
          name: DynamicAssist-Windows
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
